name: Deploy blog to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      razorfolio_version:
        description: RazorFolio version without v; leave empty for the workflow default
        required: false
        type: string

env:
  RAZORFOLIO_DEFAULT_VERSION: '0.4.0' # Example: choose a published release.

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Download native RazorFolio
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RAZORFOLIO_VERSION: ${{ inputs.razorfolio_version || env.RAZORFOLIO_DEFAULT_VERSION }}
        run: |
          if [[ ! "$RAZORFOLIO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Use a release version in major.minor.patch format, without the v prefix."
            exit 1
          fi
          archive="razorfolio-$RAZORFOLIO_VERSION-linux-x64.tar.gz"
          tool="$RUNNER_TEMP/razorfolio"
          mkdir -p "$tool/package"
          gh release download "v$RAZORFOLIO_VERSION" --repo Rukkhadevata123/RazorFolio \
            --pattern "$archive" --pattern "$archive.sha256" --dir "$tool"
          cd "$tool"
          sha256sum --check "$archive.sha256"
          tar -xzf "$archive" -C package
          ./package/rf --version
      - name: Build site
        shell: bash
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          site="$RUNNER_TEMP/site"
          mkdir "$site"
          cp -RL -- content "$site/"
          for path in static razorfolio.json; do
            if [[ -e "$path" ]]; then
              cp -RL -- "$path" "$site/"
            fi
          done

          "$RUNNER_TEMP/razorfolio/package/rf" build --site "$site" --url "$SITE_URL"
          test -f "$site/public/index.html"
          test -f "$site/public/404.html"
      - name: Upload generated site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
