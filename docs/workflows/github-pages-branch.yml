name: Publish blog to a Git branch

on:
  workflow_dispatch:
    inputs:
      razorfolio_version:
        description: RazorFolio version without v; leave empty for the workflow default
        required: false
        type: string
      target_repository:
        description: Target owner/repo (leave empty for this repository)
        required: false
        type: string
      publish_branch:
        description: Branch dedicated to generated site files
        required: true
        default: gh-pages
        type: string
      site_url:
        description: Full website URL (for example https://example.github.io/blog/)
        required: true
        type: string

env:
  RAZORFOLIO_DEFAULT_VERSION: '0.4.0' # Example: choose a published release.

permissions:
  contents: read

concurrency:
  group: pages-branch-${{ inputs.target_repository || github.repository }}-${{ inputs.publish_branch }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate publication target
        id: target
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository || github.repository }}
          PUBLISH_BRANCH: ${{ inputs.publish_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [[ -z "$PAGES_DEPLOY_TOKEN" ]]; then
            echo "::error::Set the PAGES_DEPLOY_TOKEN secret with write access to the target repository."
            exit 1
          fi
          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::The target repository must use owner/repo format."
            exit 1
          fi
          if [[ "$PUBLISH_BRANCH" == -* ]] || ! git check-ref-format "refs/heads/$PUBLISH_BRANCH"; then
            echo "::error::Enter a valid Git branch name."
            exit 1
          fi
          if [[ "${TARGET_REPOSITORY,,}" == "${GITHUB_REPOSITORY,,}" ]] && \
             [[ "$PUBLISH_BRANCH" == "$DEFAULT_BRANCH" || "refs/heads/$PUBLISH_BRANCH" == "$GITHUB_REF" ]]; then
            echo "::error::Choose a publication branch separate from the source and default branches."
            exit 1
          fi
          echo "repository=$TARGET_REPOSITORY" >> "$GITHUB_OUTPUT"
      - name: Download native RazorFolio
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RAZORFOLIO_VERSION: ${{ inputs.razorfolio_version || env.RAZORFOLIO_DEFAULT_VERSION }}
        run: |
          if [[ ! "$RAZORFOLIO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Use a release version in major.minor.patch format, without the v prefix."
            exit 1
          fi
          archive="razorfolio-$RAZORFOLIO_VERSION-linux-x64.tar.gz"
          tool="$RUNNER_TEMP/razorfolio"
          mkdir -p "$tool/package"
          gh release download "v$RAZORFOLIO_VERSION" --repo Rukkhadevata123/RazorFolio \
            --pattern "$archive" --pattern "$archive.sha256" --dir "$tool"
          cd "$tool"
          sha256sum --check "$archive.sha256"
          tar -xzf "$archive" -C package
          ./package/rf --version
      - name: Build site
        shell: bash
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: |
          site="$RUNNER_TEMP/site"
          mkdir "$site"
          cp -RL -- content "$site/"
          for path in static razorfolio.json; do
            if [[ -e "$path" ]]; then
              cp -RL -- "$path" "$site/"
            fi
          done

          "$RUNNER_TEMP/razorfolio/package/rf" build --site "$site" --url "$SITE_URL"
          test -f "$site/public/index.html"
          test -f "$site/public/404.html"
      - name: Set branch domain
        shell: bash
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          url = os.environ["SITE_URL"].strip()
          host = urlsplit(url).hostname.encode("idna").decode("ascii").lower()
          path = Path(os.environ["RUNNER_TEMP"]) / "site/public/CNAME"
          if host == "github.io" or host.endswith(".github.io"):
              path.unlink(missing_ok=True)
          else:
              path.write_text(host + "\n", encoding="utf-8")
          PY
      - name: Publish generated files
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: ${{ steps.target.outputs.repository }}
          publish_branch: ${{ inputs.publish_branch }}
          publish_dir: ${{ runner.temp }}/site/public
          enable_jekyll: false
          force_orphan: false
          keep_files: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
